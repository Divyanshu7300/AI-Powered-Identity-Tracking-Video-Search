services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOT_REID_CACHE_DIR: ${MOT_REID_CACHE_DIR:-/cache/mot-reid}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - model-cache:/cache/mot-reid
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); raise SystemExit(0 if data.get('status') in {'ok','degraded'} else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      NEXT_PUBLIC_WS_BASE: ${NEXT_PUBLIC_WS_BASE:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  model-cache:
